name = "diecast-hunter-ebay"
main = "src/index.ts"
compatibility_date = "2024-11-12"

[vars]
ENDPOINT_URL = "https://diecast-hunter-ebay.johnkgriebel.workers.dev/marketplace-deletion"

# Set the KV namespace id after running:
#   wrangler kv namespace create DELETIONS
[[kv_namespaces]]
binding = "DELETIONS"
id = "698ce6ff67ef4a1a8bdd18d605dd1cd3"

# Cache for the eBay app access token and per-kid notification public keys.
# Kept separate from DELETIONS on purpose. Before the first deploy run:
#   wrangler kv namespace create EBAY_KEY_CACHE
# and replace the placeholder id below with the value wrangler prints.
[[kv_namespaces]]
binding = "EBAY_KEY_CACHE"
id = "ce3715558b634a548c7dc133a0fc149b"
