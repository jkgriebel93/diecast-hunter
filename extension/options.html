<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Diecast Hunter — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Diecast Hunter — Extension Settings</h1>

      <p class="hint">
        Find the values below in the Diecast Hunter desktop app, under
        <strong>Settings → Browser extension &amp; background</strong>. The
        desktop app must be running (or minimized to the tray) for the extension
        to show matches and valuations.
      </p>

      <form id="form">
        <label>
          Endpoint URL
          <input
            id="endpoint"
            type="url"
            placeholder="http://localhost:17381"
            required
            autocomplete="off"
          />
        </label>
        <label>
          Shared secret
          <input id="secret" type="password" required autocomplete="off" />
        </label>
        <button type="submit" class="primary">Save</button>
      </form>
      <div id="status"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
