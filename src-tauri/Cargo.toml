[package]
name = "diecast-hunter"
version = "0.1.0"
description = "Desktop app for managing a NASCAR diecast collection."
authors = ["jkgriebel93"]
edition = "2021"

[lib]
name = "diecast_hunter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
thiserror = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies", "gzip", "stream"] }
scraper = "0.20"
regex = "1"
url = "2"
once_cell = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
