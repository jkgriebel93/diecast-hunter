name = "diecast-hunter-ebay"
main = "src/index.ts"
compatibility_date = "2024-11-12"

[vars]
ENDPOINT_URL = "https://diecast-hunter-ebay.johnkgriebel.workers.dev/marketplace-deletion"

# Cache for the eBay app access token and per-kid notification public keys.
# Before the first deploy run:
#   wrangler kv namespace create EBAY_KEY_CACHE
# and replace the placeholder id below with the value wrangler prints.
[[kv_namespaces]]
binding = "EBAY_KEY_CACHE"
id = "ce3715558b634a548c7dc133a0fc149b"

# Shared wishlists (DCH-46). Values are whole HTML documents keyed
# `share:<slug>`, each written with a TTL so links expire on their own.
# Before the first deploy run:
#   wrangler kv namespace create SHARES
# and replace the placeholder id below with the value wrangler prints.
[[kv_namespaces]]
binding = "SHARES"
id = "b63f99a466f140d9a23fb944254127c8"

# Native rate limiter for POST /marketplace-deletion. Checked inside the worker
# before the KV-backed signature lookup, so throttled requests cost no KV
# reads. 20 requests / 60s per client IP is far above legitimate eBay volume
# (deletion notifications are rare) but clamps abusive floods. namespace_id is
# any unique integer string within this worker; period must be 10 or 60.
[[unsafe.bindings]]
name = "POST_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Durable store for marketplace account deletion notifications.
# Provisioned with:
#   wrangler d1 create diecast-hunter-deletions
# Schema lives in ./migrations/0001_init.sql and was applied with:
#   wrangler d1 execute diecast-hunter-deletions --remote --file=./migrations/0001_init.sql
[[d1_databases]]
binding       = "DB"
database_name = "diecast-hunter-deletions"
database_id   = "278833a2-6bb3-431b-b94d-52611682aaa5"

# Daily purge of acked marketplace_deletions older than the retention window
# (90 days, see worker/README.md). Runs at 04:00 UTC, off-peak vs the rest of
# the worker's traffic.
[triggers]
crons = ["0 4 * * *"]

# Worker observability — captures invocation logs (incl. the structured
# `deletion_insert_failed` / `deletion_purge` events) queryable in the
# dashboard and via `wrangler tail`. head_sampling_rate = 1 keeps 100% of
# logs; volume here is tiny so there's no reason to sample down.
#
# Note that these logs are queryable but NOT alertable: Workers Logs has no
# alerting, and Cloudflare Notifications only offers threshold-shaped alert
# types that a single lost notification would never cross. That's why the
# alert on `deletion_insert_failed` goes to Sentry instead (DCH-30) — see
# SENTRY_DSN in the secrets list in README.md.
[observability]
enabled = true
head_sampling_rate = 1
